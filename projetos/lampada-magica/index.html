<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acender ou apagar?</title>

    <link rel="stylesheet" href="../lampada-magica/css/styles.css">

    <script src="../lampada-magica/js/lampada.js" defer></script>


</head>
<body>

    <header>
        <h1>Acender ou apagar?</h1>
    </header>

    <main>
        <section id="imagem-lampada">
            <img src="../lampada-magica/assets/lampada-apagada.svg" width="200" height="300" alt="Lâmpada apagada" id="lampada">
        </section>

        <section id="botoes">
            <button id="ligar" onclick="ligarLampada()">Ligar</button>
            <button id="desligar" onclick="apagarLampada()">Desligar</button>
        </section>

        <section id="conteudo">
            <p id="mensagem">A luz está apagada.</p>
        </section>

    </main>

    <footer id="rodape">
        <p>Entre em contato pelo linkedin <a href="https://www.linkedin.com/in/lindomarj%C3%BAnior-nf/">Júnior</a></p>
    </footer>

</html>
